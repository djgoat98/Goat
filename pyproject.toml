[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "goat-investor"
version = "0.1.0"
description = "Goat Investor AI — Robin Hood 10-year wealth engine powered by Claude"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "robin-stocks>=3.0.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "keyring>=25.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
]

[project.scripts]
goat = "investor.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["investor*"]
